      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Primeiro 3 -->
    <text x="60" y="115" font-family="&#39;Old English Text MT&#39;, &#39;Cloister Black&#39;, &#39;UnifrakturMaguntia&#39;, &#39;Times New Roman&#39;, serif" font-size="110" fill="#FFFFFF" text-anchor="middle">3</text>
    
    <!-- Segundo 3 (Sobreposto) -->
    <text x="95" y="115" font-family="&#39;Old English Text MT&#39;, &#39;Cloister Black&#39;, &#39;UnifrakturMaguntia&#39;, &#39;Times New Roman&#39;, serif" font-size="110" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>
</svg>